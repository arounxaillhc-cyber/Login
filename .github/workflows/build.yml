name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project files
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.opmlauncher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.opmlauncher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              kotlinOptions { jvmTarget = "17" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
          }
          EOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- ให้แอปมองเห็นเกมได้บน Android 11+ -->
              <queries>
                  <package android:name="com.onepunchman.ggplay.sea" />
              </queries>

              <application
                  android:label="OPM Launcher"
                  android:theme="@style/Theme.AppCompat.DayNight.DarkActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AutoLoginService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/opmlauncher/AutoLoginService.kt')"
          cat > 'app/src/main/java/com/example/opmlauncher/AutoLoginService.kt' <<'EOF'
          package com.example.opmlauncher

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class AutoLoginService : AccessibilityService() {

              class Request(val user: String, val pass: String, val delayMs: Long) {
                  val startedAt: Long = System.currentTimeMillis()
              }

              companion object {
                  @Volatile var request: Request? = null

                  private const val TOTAL_TIMEOUT = 15 * 60_000L

                  // ตำแหน่งปุ่ม (สัดส่วนของหน้าจอแนวนอน 0..1) คำนวณจากภาพหน้าจอเกม
                  private const val CLOSE_X = 0.829f   // ปุ่ม X ปิดประกาศ
                  private const val CLOSE_Y = 0.097f
                  private const val SWITCH_X = 0.924f  // ปุ่ม สลับบัญชี
                  private const val SWITCH_Y = 0.205f
                  private const val GRAY_X = 0.488f    // ปุ่มสีเทา เข้าเกม ในหน้าต่างบัญชี (ใช้ออกจากบัญชีเดิม)
                  private const val GRAY_Y = 0.521f
                  private const val LOGIN_X = 0.488f   // ปุ่ม ล็อกอิน (สีแดงในฟอร์ม)
                  private const val LOGIN_Y = 0.664f
                  private const val ENTER_X = 0.511f   // ปุ่ม เข้าเกม สีเหลือง หน้าแรก
                  private const val ENTER_Y = 0.808f
              }

              private enum class Stage { WAIT, LOGGED, DONE }

              private val handler = Handler(Looper.getMainLooper())
              private var current: Request? = null
              private var stage = Stage.WAIT
              private var lastTitleTap = 0L
              private var lastNodeClick = 0L
              private var loginAt = 0L
              private var attempts = 0
              private var enterTaps = 0
              private var grayTries = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  handler.post { tick() }
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent) {}
              override fun onInterrupt() {}

              // ทำงานทุก 1 วินาที (หน้าแรกของเกมอาจไม่ส่ง event จึงใช้การวนตรวจแทน)
              private fun tick() {
                  handler.postDelayed({ tick() }, 1000)
                  val req = request ?: return
                  if (req !== current) {
                      current = req
                      stage = Stage.WAIT
                      lastTitleTap = 0L; lastNodeClick = 0L; attempts = 0; enterTaps = 0; grayTries = 0
                  }
                  val now = System.currentTimeMillis()
                  if (stage == Stage.DONE || now - req.startedAt > TOTAL_TIMEOUT) return

                  val root = rootInActiveWindow ?: return
                  if (root.packageName?.toString() != Store.GAME_PACKAGE) return

                  when (stage) {
                      Stage.WAIT -> stepWait(root, req, now)
                      Stage.LOGGED -> stepLogged(root, now)
                      Stage.DONE -> {}
                  }
              }

              // ขั้นที่ 1: หาทางไปหน้าล็อกอิน (สลับบัญชี -> ใช้บัญชีใหม่ล็อกอิน) แล้วกรอก
              private fun stepWait(root: AccessibilityNodeInfo, req: Request, now: Long) {
                  val edits = ArrayList<AccessibilityNodeInfo>()
                  collectEditable(root, edits)

                  if (edits.size >= 2) {
                      val passNode = edits.firstOrNull { it.isPassword } ?: edits[1]
                      val userNode = edits.first { it != passNode }
                      setText(userNode, req.user)
                      setText(passNode, req.pass)
                      attempts++
                      stage = Stage.LOGGED
                      loginAt = now
                      handler.postDelayed({ pressLogin() }, 800)
                      return
                  }

                  // หน้าต่างเลือกบัญชี: กดปุ่มสีเทา "เข้าเกม" เพื่อออกจากบัญชีเดิม (ใช้ตำแหน่งแตะ
                  // เพราะข้อความ "เข้าเกม" ซ้ำกับปุ่มสีเหลืองหน้าแรก) ถ้าไม่ได้ผลค่อยกด "ใช้บัญชีใหม่ล็อกอิน"
                  val chooser = findByText(root, listOf("ใช้บัญชีใหม่ล็อกอิน"), false)
                  if (chooser != null) {
                      if (now - lastNodeClick >= 3000) {
                          lastNodeClick = now
                          grayTries++
                          if (grayTries <= 2) tapFraction(GRAY_X, GRAY_Y) else clickNode(chooser)
                      }
                      return
                  }

                  if (now - req.startedAt < req.delayMs) return

                  // อยู่หน้าแรกของเกม: ปิดประกาศ แล้วกดสลับบัญชี (ลองซ้ำทุก 6 วินาทีจนเจอหน้าล็อกอิน)
                  if (now - lastTitleTap >= 6000) {
                      lastTitleTap = now
                      tapFraction(CLOSE_X, CLOSE_Y)
                      handler.postDelayed({ openSwitchAccount() }, 1500)
                  }
              }

              // ขั้นที่ 2: รอผลล็อกอิน แล้วกดเข้าเกมสีเหลือง
              private fun stepLogged(root: AccessibilityNodeInfo, now: Long) {
                  val edits = ArrayList<AccessibilityNodeInfo>()
                  collectEditable(root, edits)
                  val t = now - loginAt

                  if (edits.size >= 2) {
                      // ฟอร์มยังอยู่ = กดล็อกอินไม่โดนหรือล็อกอินไม่ผ่าน
                      if (t > 8000) {
                          grayTries = 0
                          stage = if (attempts < 3) Stage.WAIT else Stage.DONE
                      }
                      return
                  }
                  // ถ้าหน้าต่างเลือกบัญชีโผล่มาอีก ห้ามกดปุ่มสีเทา (มันจะออกจากบัญชีอีกรอบ) ให้รอก่อน
                  if (findByText(root, listOf("ใช้บัญชีใหม่ล็อกอิน"), false) != null) return
                  if (enterTaps == 0 && t >= 5000) {
                      enterGame(root)
                      enterTaps = 1
                  } else if (enterTaps == 1 && t >= 12000) {
                      enterGame(rootInActiveWindow ?: root)
                      enterTaps = 2
                      stage = Stage.DONE
                  }
              }

              private fun openSwitchAccount() {
                  val root = rootInActiveWindow
                  val node = if (root != null) findByText(root, listOf("สลับบัญชี"), false) else null
                  if (node != null) clickNode(node) else tapFraction(SWITCH_X, SWITCH_Y)
              }

              private fun pressLogin() {
                  val root = rootInActiveWindow
                  val btn = if (root != null) findByText(root, listOf("ล็อกอิน"), true) else null
                  if (btn != null) clickNode(btn) else tapFraction(LOGIN_X, LOGIN_Y)
              }

              private fun enterGame(root: AccessibilityNodeInfo) {
                  val btn = findByText(root, listOf("เข้าเกม"), true)
                  if (btn != null) clickNode(btn) else tapFraction(ENTER_X, ENTER_Y)
              }

              // ---------- ตัวช่วย ----------

              private fun collectEditable(n: AccessibilityNodeInfo, out: MutableList<AccessibilityNodeInfo>) {
                  if (n.isEditable) out.add(n)
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      collectEditable(c, out)
                  }
              }

              private fun setText(n: AccessibilityNodeInfo, text: String) {
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              private fun labelOf(n: AccessibilityNodeInfo): String =
                  (n.text?.toString() ?: n.contentDescription?.toString() ?: "").trim()

              private fun findByText(n: AccessibilityNodeInfo, words: List<String>, exact: Boolean): AccessibilityNodeInfo? {
                  val label = labelOf(n)
                  if (label.isNotEmpty() && words.any { if (exact) label == it else label.contains(it) }) return n
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      val r = findByText(c, words, exact)
                      if (r != null) return r
                  }
                  return null
              }

              private fun clickNode(n: AccessibilityNodeInfo) {
                  var cur: AccessibilityNodeInfo? = n
                  while (cur != null) {
                      if (cur.isClickable && cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return
                      cur = cur.parent
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  if (!r.isEmpty) tapPx(r.exactCenterX(), r.exactCenterY())
              }

              @Suppress("DEPRECATION")
              private fun tapFraction(fx: Float, fy: Float) {
                  val m = DisplayMetrics()
                  (getSystemService(WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(m)
                  // เกมเป็นแนวนอน: ด้านยาว = กว้าง
                  val w = maxOf(m.widthPixels, m.heightPixels).toFloat()
                  val h = minOf(m.widthPixels, m.heightPixels).toFloat()
                  tapPx(fx * w, fy * h)
              }

              private fun tapPx(x: Float, y: Float) {
                  val path = Path()
                  path.moveTo(x, y)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  dispatchGesture(g, null, null)
              }
          }
          EOF
          mkdir -p "$(dirname 'app/src/main/java/com/example/opmlauncher/MainActivity.kt')"
          cat > 'app/src/main/java/com/example/opmlauncher/MainActivity.kt' <<'EOF'
          package com.example.opmlauncher

          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey

          object Store {
              // เกมเวอร์ชัน SEA (ไทย)
              const val GAME_PACKAGE = "com.onepunchman.ggplay.sea"

              class Saved(
                  val user: String, val pass: String,
                  val remember: Boolean, val encrypt: Boolean, val delaySec: Int
              )

              private fun plain(c: Context) = c.getSharedPreferences("settings", Context.MODE_PRIVATE)

              private fun enc(c: Context) = EncryptedSharedPreferences.create(
                  c, "creds",
                  MasterKey.Builder(c).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(),
                  EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                  EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
              )

              fun load(c: Context): Saved {
                  val s = plain(c)
                  val encrypt = s.getBoolean("encrypt", true)
                  val remember = s.getBoolean("remember", true)
                  var u = ""
                  var p = ""
                  if (remember) {
                      if (encrypt) {
                          runCatching {
                              val e = enc(c)
                              u = e.getString("u", "") ?: ""
                              p = e.getString("p", "") ?: ""
                          }
                      } else {
                          u = s.getString("u", "") ?: ""
                          p = s.getString("p", "") ?: ""
                      }
                  }
                  return Saved(u, p, remember, encrypt, s.getInt("delay", 20))
              }

              fun save(c: Context, user: String, pass: String, remember: Boolean, encrypt: Boolean, delaySec: Int) {
                  val e = plain(c).edit()
                  e.putBoolean("remember", remember).putBoolean("encrypt", encrypt).putInt("delay", delaySec)
                  e.remove("u").remove("p")
                  runCatching { enc(c).edit().clear().apply() }
                  if (remember) {
                      if (encrypt) {
                          runCatching { enc(c).edit().putString("u", user).putString("p", pass).apply() }
                      } else {
                          e.putString("u", user).putString("p", pass)
                      }
                  }
                  e.apply()
              }

              fun clear(c: Context) {
                  plain(c).edit().remove("u").remove("p").apply()
                  runCatching { enc(c).edit().clear().apply() }
              }
          }

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val saved = Store.load(this)

                  val user = EditText(this).apply {
                      hint = "Username (ไอดี)"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                      setText(saved.user)
                  }
                  val pass = EditText(this).apply {
                      hint = "Password (พาสเวิร์ด)"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(saved.pass)
                  }
                  val delay = EditText(this).apply {
                      hint = "เริ่มกดหลังเปิดเกม (วินาที)"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(saved.delaySec.toString())
                  }
                  val delayLabel = TextView(this).apply {
                      text = "ตั้งเวลารอให้เกมโหลดถึงหน้าแรก (เครื่องช้าใส่เยอะๆ เช่น 120)"
                      textSize = 12f
                  }
                  val remember = CheckBox(this).apply {
                      text = "บันทึก user/pass ไว้ในเครื่อง"
                      isChecked = saved.remember
                  }
                  val encrypt = CheckBox(this).apply {
                      text = "เข้ารหัสข้อมูลที่บันทึก (ถ้าไม่ติ๊ก จะเก็บเป็นข้อความธรรมดา)"
                      isChecked = saved.encrypt
                  }
                  val clear = Button(this).apply {
                      text = "ลบข้อมูลที่บันทึก"
                      setOnClickListener {
                          Store.clear(context)
                          user.setText("")
                          pass.setText("")
                          Toast.makeText(context, "ลบแล้ว", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val perm = Button(this).apply {
                      text = "1) เปิดสิทธิ์ Accessibility (ทำครั้งเดียว)"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }
                  val go = Button(this).apply {
                      text = "2) เข้าเกม (สลับไปบัญชีนี้)"
                      setOnClickListener {
                          val u = user.text.toString()
                          val p = pass.text.toString()
                          val d = (delay.text.toString().toIntOrNull() ?: 20).coerceIn(0, 600)
                          Store.save(context, u, p, remember.isChecked, encrypt.isChecked, d)

                          if (u.isBlank() || p.isBlank()) {
                              Toast.makeText(context, "กรอก user/pass ก่อน", Toast.LENGTH_LONG).show()
                              return@setOnClickListener
                          }
                          if (!isServiceEnabled()) {
                              Toast.makeText(context, "ต้องเปิดสิทธิ์ Accessibility ก่อน", Toast.LENGTH_LONG).show()
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                              return@setOnClickListener
                          }
                          val intent = packageManager.getLaunchIntentForPackage(Store.GAME_PACKAGE)
                          if (intent == null) {
                              Toast.makeText(context, "ไม่พบเกมในเครื่อง", Toast.LENGTH_LONG).show()
                              return@setOnClickListener
                          }
                          // ส่งงานให้ service (เก็บในหน่วยความจำเท่านั้น)
                          AutoLoginService.request = AutoLoginService.Request(u, p, d * 1000L)
                          startActivity(intent)
                      }
                  }

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                      addView(user); addView(pass); addView(delay); addView(delayLabel)
                      addView(remember); addView(encrypt); addView(clear)
                      addView(perm); addView(go)
                  }
                  setContentView(ScrollView(this).apply { addView(box) })
              }

              private fun isServiceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.contains("$packageName/${AutoLoginService::class.java.name}")
              }
          }
          EOF
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'EOF'
          <resources>
              <string name="service_desc">ใช้กรอก username/password และกดล็อกอินในเกมให้อัตโนมัติ เฉพาะเมื่อกดปุ่ม "เข้าเกม" จากแอปนี้</string>
          </resources>
          EOF
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_config.xml')"
          cat > 'app/src/main/res/xml/accessibility_config.xml' <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="300"
              android:description="@string/service_desc" />
          EOF
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          kotlin.code.style=official
          EOF
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "OpmLauncher"
          include(":app")
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OpmLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  
